<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Cubechat — знайдіть мене</title>
<meta name="description" content="Someone shared their Cubechat @name with you." />
<link rel="icon" href="/cube.svg" type="image/svg+xml" />
<style>
  :root { --bg:#06140d; --fg:#ffffff; --accent:#2edb8f; --mut:rgba(255,255,255,.6); --line:rgba(255,255,255,.08); }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; background:var(--bg); color:var(--fg); min-height:100%; }
  body { font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  .wrap { max-width:520px; margin:0 auto; padding:64px 20px 80px; text-align:center; }
  .brand { display:inline-flex; align-items:center; gap:10px; font-size:18px; font-weight:600; }
  .dot { width:9px; height:9px; border-radius:99px; background:var(--accent); box-shadow:0 0 8px 2px rgba(46,219,143,.55); }
  h1 { font-size:40px; letter-spacing:-.02em; margin:48px 0 8px; word-break:break-all; }
  p { color:var(--mut); }
  .card { background:rgba(255,255,255,.03); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin:28px 0; text-align:left; }
  .card ol { margin:0; padding-left:20px; color:var(--mut); }
  .card li { margin:6px 0; }
  code { font:14px ui-monospace,SFMono-Regular,Menlo,monospace; background:rgba(255,255,255,.06); padding:2px 6px; border-radius:4px; color:var(--accent); }
  .btns { display:flex; flex-direction:column; gap:10px; margin-top:8px; }
  a.btn { display:block; padding:13px 16px; border-radius:12px; background:rgba(46,219,143,.14); color:var(--accent); text-decoration:none; font-weight:600; }
  a.btn.ghost { background:transparent; border:1px solid var(--line); color:var(--fg); }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span>Cubechat</div>

  <h1 id="name">Cubechat</h1>
  <p id="lead">Захищений месенджер, що працює навіть без інтернету.</p>

  <div class="card" id="how" hidden>
    <ol>
      <li>Встановіть Cubechat.</li>
      <li>Відкрийте <strong>Профіль → Картка контакту</strong>.</li>
      <li>У полі внизу введіть <code id="code"></code> і натисніть «Додати».</li>
    </ol>
  </div>

  <div class="btns">
    <a class="btn" href="https://github.com/Kuzminyo/cubechat/releases/download/apk-latest/cubechat-universal.apk">Android — завантажити APK</a>
    <a class="btn ghost" href="/downloads/cubechat-ios-sideload.txt">iPhone — як встановити</a>
    <a class="btn ghost" href="/">Що таке Cubechat</a>
  </div>
</div>
<script>
  // The name lives after the '#', so it never reaches any server — not even
  // this one. Only a valid Cube ID shape is shown; anything else leaves the
  // neutral page as it is.
  (function () {
    var raw = decodeURIComponent((location.hash || '').slice(1)).trim().replace(/^@/, '').toLowerCase();
    if (!/^[a-z0-9_]{3,20}$/.test(raw)) return;
    document.getElementById('name').textContent = '@' + raw;
    document.getElementById('lead').textContent = 'Знайдіть @' + raw + ' у Cubechat.';
    document.getElementById('code').textContent = '@' + raw;
    document.getElementById('how').hidden = false;
    document.title = '@' + raw + ' — Cubechat';
  })();
</script>
</body>
</html>
